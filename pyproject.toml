[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bulk-renamer"
version = "1.0.0"
description = "Safe, dry-run-first CLI for bulk renaming files"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
bulk-renamer = "bulk_renamer:main"

[tool.setuptools]
py-modules = ["bulk_renamer"]
