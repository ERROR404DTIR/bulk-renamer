<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Bulk Renamer</title><desc id="d">Animated file names transform into an orderly sequence.</desc><defs><linearGradient id="bg"><stop stop-color="#1b2037"/><stop offset="1" stop-color="#0b1220"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><g font-family="monospace" font-size="19"><g fill="#91a0ba"><text x="90" y="112">IMG_0391 copy final.jpg</text><text x="90" y="163">IMG_0391 copy 2.jpg</text><text x="90" y="214">IMG_0391.jpg</text></g><path d="M510 105H650M510 156H650M510 207H650" stroke="#536782" stroke-width="2" stroke-dasharray="6 8"/><g fill="#62e3c1"><text x="700" y="112">photo-001.jpg</text><text x="700" y="163">photo-002.jpg</text><text x="700" y="214">photo-003.jpg</text></g></g><path d="M570 80L620 156L570 232" fill="none" stroke="#a89bff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/></path><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">BULK RENAMER</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">PREVIEW / TRANSFORM / APPLY</text></svg>